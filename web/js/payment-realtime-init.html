
<!-- Initialize payment realtime subscription after page loads -->
<script>
  document.addEventListener('DOMContentLoaded', function(){
    try {
      if (typeof startPaymentRealtimeAll === 'function') {
        startPaymentRealtimeAll(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        // Wait briefly for the realtime script to load if it's appended asynchronously
        setTimeout(function(){ if (window.startPaymentRealtimeAll) window.startPaymentRealtimeAll(SUPABASE_URL, SUPABASE_ANON_KEY); }, 500);
      }
    } catch (err) {
      console.warn('Payment realtime init error', err);
    }
  });
</script>
