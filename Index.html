<!-- Safety and fixes injected: ensure these run BEFORE the main inline script to avoid TypeErrors and override the Moniepoint renderer -->
<script>
  (function(){
    const origGet = document.getElementById.bind(document);
    document.getElementById = function(id){
      const el = origGet(id);
      if (el) return el;
      // return a minimal dummy element that safely ignores addEventListener calls
      return new Proxy({}, {
        get(target, prop) {
          if (prop === 'addEventListener') return function(){};
          if (prop === 'value') return '';
          if (prop === 'classList') return { add: function(){}, remove: function(){} };
          if (prop === 'innerText' || prop === 'innerHTML') return '';
          if (prop === 'reset') return function(){};
          return function(){};
        }
      });
    };
  })();
</script>

    // --- REAL-TIME TOAST POPUP NOTIFICATION ---
    function showMoniepointToast(message) {
      try { document.getElementById('toast-message').innerText = message; } catch(e){}
      const toastElement = document.getElementById('moniepoint-toast');
      const toast = new bootstrap.Toast(toastElement, { delay: 5000 });
      toast.show();
    }

    // --- TRIPLE SAVING METHOD IMPLEMENTATION ---
    async function saveDB() {
      // 1. Save to local browser storage
      localStorage.setItem(DB_KEY, JSON.stringify(db));

      // 2. Save concurrently to Supabase database (Cloud persistent storage)
      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('inventory')
            .upsert({ id: 1, payload: db, updated_at: new Date().toISOString() });
          
          if (error) {
            console.error('Supabase sync error:', error.message);
          }
        } catch (err) {
          console.error('Network error during Supabase triple saving sync:', err);
        }
      }

      renderAll();
    }

    // Initial load sync check from Supabase on startup
    async function initTripleSavingSync() {
      if (supabaseClient) {
        try {
          const { data, error } = await supabaseClient
            .from('inventory')
            .select('payload')
            .eq('id', 1)
            .single();
          
          if (!error && data && data.payload) {
            db = data.payload;
            localStorage.setItem(DB_KEY, JSON.stringify(db));
          }
        } catch (err) {
          console.warn('Supabase init sync failed', err);
        }
      }

      renderAll();
    }

    // --- UI helper functions and renderers ---

    // renderMoniepointPayments is provided by /fixes/moniepoint-render-fix.js (loaded earlier)
